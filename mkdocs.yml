site_name: mcflayer
site_description: asyncio Minecraft Java Edition bot library — quickstart, guide, API reference, roadmap and session log
site_dir: site
docs_dir: docs
copyright: mcflayer documentation
repo_url: https://github.com/draganoxfool/Mcflayer
repo_name: draganoxfool/Mcflayer
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Guide:
      - Overview: modules/index.md
      - Errors: modules/errors.md
      - Models: modules/models.md
      - Internal: modules/internal.md
      - Data: modules/data.md
      - Protocol primitives: modules/protocol.md
      - Transport: modules/transport.md
      - Protodef compiler: modules/protodef.md
      - Auth: modules/auth.md
      - Protocol client: modules/client.md
      - Events: modules/events.md
      - Bot: modules/bot.md
      - World: modules/world.md
      - Physics: modules/physics.md
      - Pathfinding: modules/pathfinding.md
      - Actions: modules/actions.md
      - Commands: modules/commands.md
      - Tasks: modules/tasks.md
      - Swarm: modules/swarm.md
  - API reference:
      - Overview: reference/index.md
      - pyflayer: reference/pyflayer.md
      - Errors: reference/errors.md
      - Models: reference/models.md
      - Internal: reference/internal.md
      - Data: reference/data.md
      - Protocol: reference/protocol.md
      - Protodef compiler: reference/protodef.md
      - Auth: reference/auth.md
      - Events: reference/events.md
      - Bot: reference/bot.md
      - World: reference/world.md
      - Physics: reference/physics.md
      - Pathfinding: reference/pathfinding.md
      - Actions: reference/actions.md
      - Testing: reference/testing.md
      - CLI: reference/cli.md
      - Commands: reference/commands.md
      - Tasks: reference/tasks.md
      - Swarm: reference/swarm.md
  - Project:
      - Architecture: ARCHITECTURE.md
      - Roadmap: ROADMAP.md
      - Sessions: sessions.md
      - Tasks: tasks.md
      - Prompts: PROMPTS.md
      - Post prompt: "POST PROMPT.md"
      - Migrating from discord.py: migrating-from-discordpy.md
      - Handoff:
          - M1: handoff/M1.md
          - M2: handoff/M2.md
          - M3: handoff/M3.md
          - M4: handoff/M4.md
          - M5: handoff/M5.md
          - M6: handoff/M6.md
          - M7: handoff/M7.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: table
            annotations_path: brief
            filters: ["!^_"]
            members_order: source
            group_by_category: true
            show_root_heading: true
            show_root_full_path: false
            show_root_toc_entry: true
            show_object_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_source: false
            show_signature: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            show_if_no_docstring: true
            show_bases: true
            inherited_members: false
